version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER}/qolum-backend:${TAG}
    container_name: ilkin-backend-dev
    ports:
      - "8098:8080"  # Expose port 8080 of backend to port 8098 of the host
    environment:
      - SPRING_PROFILES_ACTIVE=dev  # Set profile to dev
    networks:
      - qolum-dev-network

networks:
  qolum-dev-network:
    driver: bridge
